<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Abbott — Mapa de eventos</title>
  <style>
    :root {
      --ink: #123445;
      --muted: #617482;
      --line: #d7e2e8;
      --surface: #f5f8fa;
      --white: #fff;
      --brand: #087f99;
      --brand-soft: #e4f5f8;
      --purple: #5c1678;
      --red: #ba3547;
      --yellow: #bd7800;
      --green: #16805c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--surface);
    }
    button { font: inherit; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 28px 22px 52px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 30px; }
    .top strong { font-size: 18px; }
    .crumb { color: var(--muted); font-size: 13px; }
    .tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .tool {
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--white);
      color: var(--ink);
      padding: 28px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: transform .16s ease, border-color .16s ease;
    }
    .tool:hover { transform: translateY(-2px); border-color: var(--brand); }
    .tool span { color: var(--muted); margin-top: 7px; }
    .tool strong { font-size: 26px; text-decoration: underline; text-underline-offset: 6px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .button.active { text-decoration-thickness: 3px; }
    .button.active, .button.primary { background: var(--brand); border-color: var(--brand); color: white; }
    .button.red.active { background: var(--red); border-color: var(--red); }
    .button.yellow.active { background: var(--yellow); border-color: var(--yellow); }
    .button.green.active { background: var(--green); border-color: var(--green); }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    .panel h1 { margin: 0 0 6px; font-size: 26px; }
    .panel > p { margin: 0 0 22px; color: var(--muted); }
    .flow { display: grid; grid-template-columns: minmax(0, 1fr) 170px minmax(0, 1fr); gap: 18px; align-items: center; }
    .feature h2 { font-size: 16px; margin: 0 0 9px; }
    .crop {
      height: 390px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #edf3f6;
    }
    .crop img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .crop.form img { object-position: 50% 38%; }
    .crop.result img { object-position: 50% 18%; }
    .crop.cta img { object-position: 50% 23%; }
    .crop.registration img { object-position: 50% 35%; }
    .crop.confirmation img { object-position: 50% 0%; }
    .transition { align-self: center; }
    .redirect-arrow { position: relative; height: 3px; margin: 18px 10px; background: var(--brand); }
    .redirect-arrow::after { content: ''; position: absolute; right: -1px; top: -6px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 12px solid var(--brand); }
    .destination p { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
    .flow.destination-view { grid-template-columns: minmax(0, 600px); justify-content: center; }
    .signal {
      background: var(--brand-soft);
      border-radius: 42% 58% 46% 54% / 55% 46% 54% 45%;
      padding: 24px 13px;
      text-align: center;
    }
    .signal span, .signal code { display: block; }
    .signal strong { display: block; color: var(--brand); margin: 5px 0; overflow-wrap: anywhere; }
    .signal code { font-size: 12px; margin-top: 3px; }
    .signal small { display: block; font-size: 11px; margin-top: 6px; }
    .crop.share img { object-position: 50% 85%; }
    .feature-footer { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 12px; }
    details { margin-top: 10px; color: var(--muted); }
    details code { display: inline-block; margin: 5px 8px 0 0; color: var(--ink); }
    details a { display: block; margin-top: 8px; color: var(--brand); }
    .hidden { display: none !important; }
    .empty { padding: 42px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 760px) {
      .shell { padding: 20px 14px 38px; }
      .tool-grid, .flow { grid-template-columns: 1fr; }
      .signal { border-radius: 28px; }
      .crop { height: 330px; }
      .redirect-arrow { width: 3px; height: 36px; margin: 14px auto; }
      .redirect-arrow::after { right: -5.5px; top: auto; bottom: -1px; border-top: 12px solid var(--brand); border-bottom: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <strong>Mapa de medición</strong>
      <span class="crumb" id="crumb">Herramientas</span>
    </header>

    <section id="home" class="tool-grid">
      <button class="tool" data-tool="mac">
        <strong>Calculadora de masa muscular</strong>
        <span>MAC</span>
      </button>
      <button class="tool" data-tool="growth">
        <strong>Growth Tool</strong>
        <span>13 países</span>
      </button>
    </section>

    <section id="mac" class="panel hidden">
      <div class="toolbar"><button class="button" data-back="home">← Herramientas</button></div>
      <h1>Calculadora de masa muscular</h1>
      <p>Flujo pendiente de documentar. Propiedad GA4: 505260213.</p>
    </section>

    <section id="growth" class="panel hidden">
      <div class="toolbar">
        <button class="button" data-back="home">← Herramientas</button>
        <button class="button" data-group="direct">CO · PE · MX</button>
        <button class="button" data-group="redirect">CL · EC · AR</button>
        <button class="button" data-group="cadr">CADR</button>
      </div>
      <div id="groupEmpty" class="empty">Selecciona un grupo de países.</div>
      <div id="countryArea" class="hidden">
        <div class="toolbar" id="countryButtons"></div>
        <div id="countryEmpty" class="empty">Selecciona un país.</div>
        <div id="countryFlow" class="hidden">
          <h1 id="journeyTitle">Growth Tool · Colombia</h1>
          <p id="stepLabel">Completa el formulario y selecciona Siguiente.</p>
          <div class="toolbar hidden" id="outcomes">
            <button class="button red" data-outcome="rojo" aria-pressed="false">Rojo</button>
            <button class="button yellow" data-outcome="amarillo" aria-pressed="false">Amarillo</button>
            <button class="button green" data-outcome="verde" aria-pressed="false">Verde</button>
          </div>
          <div class="flow" id="flowContent"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const assets = {
      CO: {
        form: "assets/8e4a83235271b63e.png",
        rojo: "assets/1ba4d415e3db16a2.png",
        amarillo: "assets/14e1e9c5fa085f9c.png",
        verde: "assets/aeaaef1de56af7fb.png",
        cta: "assets/1ba4d415e3db16a2.png",
        registration: "assets/895def507e738fe3.png",
        confirmation: "assets/849830ab8d5e1ca4.png"
      },
      CL: {
        form: "assets/f05421e597a81f92.png",
        rojo: "assets/0b3d8b4ae99211e1.png",
        amarillo: "assets/657ce6e266837b8f.png",
        verde: "assets/346c30a802e37904.png",
        amarilloCta: "assets/15aa22a2df8b73b2.png",
        cta: "assets/0b3d8b4ae99211e1.png",
        registration: "assets/a3ea330f29f32faf.png",
        confirmation: "assets/30c0819c7f2f32b4.png"
      }
    };
    const groups = {
      direct: ['CO', 'PE', 'MX'],
      redirect: ['CL', 'EC', 'AR'],
      cadr: ['GT', 'HN', 'SV', 'PA', 'DO', 'CR', 'NI']
    };
    let outcome = 'rojo';
    let step = 0;
    let selectedCountry = 'CO';

    const screens = ['home', 'mac', 'growth'];
    function showScreen(id) {
      screens.forEach(screen => document.getElementById(screen).classList.toggle('hidden', screen !== id));
      document.getElementById('crumb').textContent = id === 'home' ? 'Herramientas' : id === 'mac' ? 'Herramientas / MAC' : 'Herramientas / Growth Tool';
    }

    document.querySelectorAll('[data-tool]').forEach(button => button.addEventListener('click', () => showScreen(button.dataset.tool)));
    document.querySelectorAll('[data-back]').forEach(button => button.addEventListener('click', () => showScreen(button.dataset.back)));

    document.querySelectorAll('[data-group]').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('[data-group]').forEach(item => item.classList.toggle('active', item === button));
      document.getElementById('groupEmpty').classList.add('hidden');
      document.getElementById('countryArea').classList.remove('hidden');
      document.getElementById('countryFlow').classList.add('hidden');
      document.getElementById('countryEmpty').classList.remove('hidden');
      document.getElementById('countryButtons').innerHTML = groups[button.dataset.group].map(country => '<button class="button" data-country="' + country + '">' + country + '</button>').join('');
      document.querySelectorAll('[data-country]').forEach(countryButton => countryButton.addEventListener('click', () => selectCountry(countryButton)));
    }));

    function selectCountry(button) {
      document.querySelectorAll('[data-country]').forEach(item => item.classList.toggle('active', item === button));
      if (!['CO', 'CL'].includes(button.dataset.country)) {
        document.getElementById('countryFlow').classList.add('hidden');
        document.getElementById('countryEmpty').classList.remove('hidden');
        document.getElementById('countryEmpty').textContent = button.dataset.country + ': se construirá después de aprobar Colombia.';
        return;
      }
      document.getElementById('countryEmpty').classList.add('hidden');
      document.getElementById('countryFlow').classList.remove('hidden');
      selectedCountry = button.dataset.country;
      document.getElementById('journeyTitle').textContent = 'Growth Tool · ' + (selectedCountry === 'CO' ? 'Colombia' : 'Chile');
      step = 0;
      outcome = 'rojo';
      renderFlow();
    }

    document.querySelectorAll('[data-outcome]').forEach(button => button.addEventListener('click', () => {
      outcome = button.dataset.outcome;
      step = 1;
      renderFlow();
    }));

    function feature(title, image, cropClass, params, nextLabel, evidence = '') {
      const previous = step > 0 ? '<button class="button" id="previousStep">Anterior</button>' : '<span></span>';
      return '<div class="feature"><h2>' + title + '</h2><div class="crop ' + cropClass + '"><img src="' + image + '" alt="' + title + '"></div><div class="feature-footer">' + previous + '<button class="button primary" id="nextStep">' + nextLabel + '</button></div>' + (params.length ? '<details><summary>Ver parámetros</summary>' + params.map(param => '<code>' + param + '</code>').join('') + (evidence ? '<a href="' + evidence + '" target="_blank" rel="noopener">Ver evidencia</a>' : '') + '</details>' : '') + '</div>';
    }

    function signal(action, eventName, status = '') {
      return '<div class="signal"><span>' + action + '</span><strong>' + eventName + '</strong>' + (status ? '<small>' + status + '</small>' : '') + '</div>';
    }

    function renderFlow() {
      const content = document.getElementById('flowContent');
      const outcomes = document.getElementById('outcomes');
      const countryAssets = assets[selectedCountry];
      const isChile = selectedCountry === 'CL';
      const isShare = isChile && outcome === 'verde';
      const destinationTitle = isChile ? 'Página de PediaSure' : 'Página de destino';
      const destinationImage = '<div class="feature destination"><h2>' + destinationTitle + (isChile && outcome === 'amarillo' ? ' · ejemplo' : '') + '</h2><div class="crop confirmation"><img src="' + countryAssets.confirmation + '" alt="' + destinationTitle + ' tras crear el usuario"></div><p>Usuario creado · cupón en camino.</p></div>';
      content.classList.toggle('destination-view', step === 4);
      outcomes.classList.toggle('hidden', step === 0);
      document.querySelectorAll('[data-outcome]').forEach(button => {
        button.classList.remove('hidden');
        const active = button.dataset.outcome === outcome;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });

      if (step === 0) {
        document.getElementById('stepLabel').textContent = 'Completa el formulario y selecciona Siguiente.';
        content.innerHTML = feature('Formulario', countryAssets.form, 'form', ['country', 'birthday', 'height', 'gender'], 'Siguiente') + signal('Clic en Calcular', 'gc_submission') + '<div class="empty">Rojo · Amarillo · Verde</div>';
      } else if (step === 1) {
        document.getElementById('stepLabel').textContent = 'Selecciona un resultado y continúa con Siguiente.';
        content.innerHTML = feature('Resultado ' + outcome, countryAssets[outcome], 'result', ['result: result_' + (outcome === 'amarillo' ? 'yellow' : outcome === 'verde' ? 'green' : 'red'), 'heightComparison', 'outcome'], 'Siguiente') + signal('Resultado visible', 'gc_submission') + '<div class="empty">' + (isShare ? 'Copiar enlace' : 'CTA de cupón') + '</div>';
      } else if (step === 2 && isShare) {
        document.getElementById('stepLabel').textContent = 'Selecciona Copiar para compartir la herramienta.';
        content.innerHTML = feature('Copiar enlace', countryAssets.verde, 'share', ['link_text: Copiar', 'link_url: vacío en captura'], 'Volver al formulario') + signal('Clic en Copiar', 'gc_share_tool', 'Capturado · GA4') + '<div class="empty">Sin redirección · sin registro</div>';
      } else if (step === 2) {
        document.getElementById('stepLabel').textContent = 'Selecciona el CTA para ir al formulario de registro.';
        const ctaImage = isChile && outcome === 'amarillo' ? countryAssets.amarilloCta : countryAssets.cta;
        const confirmedYellow = isChile && outcome === 'amarillo';
        const ctaParams = confirmedYellow ? ['country: CL', 'link_text: Obtén tu cupón'] : ['link_text', 'link_url', 'result'];
        content.innerHTML = feature(isChile ? 'Obtén tu cupón' : 'Reclama tu cupón', ctaImage, 'cta', ctaParams, 'Siguiente', confirmedYellow ? "assets/b5a4d3561f1b2739.png" : '') + signal('Clic en CTA', 'gc_register_button', confirmedYellow ? 'Confirmado · evidencia manual' : '') + '<div class="empty">Formulario de registro</div>';
      } else if (step === 3) {
        document.getElementById('stepLabel').textContent = 'Completa y envía el registro. Al crear el usuario, se redirige a ' + (isChile ? 'PediaSure.' : 'la página de destino.');
        content.innerHTML = feature('Formulario de registro', countryAssets.registration, 'registration', ['country', 'pageName'], 'Siguiente') + '<div class="transition">' + signal('Registro enviado', 'registro_exitoso') + '<div class="redirect-arrow" role="img" aria-label="El registro redirige a ' + destinationTitle + '"></div></div>' + destinationImage;
      } else {
        document.getElementById('stepLabel').textContent = 'Usuario creado. Revisa el mensaje del cupón.';
        content.innerHTML = feature(destinationTitle + (isChile && outcome === 'amarillo' ? ' · ejemplo' : ''), countryAssets.confirmation, 'confirmation', [], 'Volver al formulario');
      }

      document.getElementById('nextStep').addEventListener('click', () => {
        if (step >= (isShare ? 2 : 4)) step = 0;
        else step += 1;
        renderFlow();
      });
      document.getElementById('previousStep')?.addEventListener('click', () => {
        step = Math.max(0, step - 1);
        renderFlow();
      });
    }
  </script>
</body>
</html>
