<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Abbott — Mapa de eventos</title>
  <style>
    :root {
      --ink: #123445;
      --muted: #617482;
      --line: #d7e2e8;
      --surface: #f5f8fa;
      --white: #fff;
      --brand: #087f99;
      --brand-soft: #e4f5f8;
      --purple: #5c1678;
      --red: #ba3547;
      --yellow: #bd7800;
      --green: #16805c;
      --image-height: clamp(180px, calc(100svh - 380px), 340px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--surface);
    }
    button { font: inherit; }
    .shell { max-width: 1100px; margin: 0 auto; padding: 20px 18px 32px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .top strong { font-size: 18px; }
    .crumb { color: var(--muted); font-size: 13px; }
    .tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .tool {
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--white);
      color: var(--ink);
      padding: 28px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: transform .16s ease, border-color .16s ease;
    }
    .tool:hover { transform: translateY(-2px); border-color: var(--brand); }
    .tool span { color: var(--muted); margin-top: 7px; }
    .tool strong { font-size: 26px; text-decoration: underline; text-underline-offset: 6px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .button.active { text-decoration-thickness: 3px; }
    .button.active, .button.primary { background: var(--brand); border-color: var(--brand); color: white; }
    .button.red.active { background: var(--red); border-color: var(--red); }
    .button.yellow.active { background: var(--yellow); border-color: var(--yellow); }
    .button.green.active { background: var(--green); border-color: var(--green); }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .panel h1 { margin: 0 0 6px; font-size: 26px; }
    .panel > p { margin: 0 0 22px; color: var(--muted); }
    .flow { display: grid; grid-template-columns: minmax(0, 560px) minmax(240px, 1fr); grid-template-rows: auto 1fr; gap: 14px; align-items: start; }
    .flow > .feature:first-child { grid-column: 1; grid-row: 1 / span 2; min-width: 0; }
    .flow > .signal, .flow > .empty, .flow > .result-examples { grid-column: 2; }
    .flow.registration-view { grid-template-columns: minmax(0, 1fr) 240px minmax(0, 1fr); grid-template-rows: auto; }
    .flow.registration-view > .feature:first-child { grid-row: 1; }
    .flow.registration-view > .result-examples { grid-column: 1 / -1; }
    .destination p { overflow-wrap: anywhere; }
    .feature h2 { font-size: 16px; margin: 0 0 9px; }
    .crop {
      height: var(--image-height);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #edf3f6;
    }
    .crop img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; border-radius: 12px; }
    .transition { align-self: center; }
    .result-route { --route-color: var(--red); --route-soft: #fff0f2; }
    .result-route.yellow { --route-color: var(--yellow); --route-soft: #fff8df; }
    .result-route.green { --route-color: var(--green); --route-soft: #e8f7ef; }
    .result-route .signal { background: var(--route-soft); border: 2px solid var(--route-color); }
    .result-route .signal strong { color: var(--route-color); }
    .result-route .redirect-arrow { background: var(--route-color); }
    .result-route .redirect-arrow::after { border-left-color: var(--route-color); }
    .flow.result-route > .feature:first-child .crop { border: 3px solid var(--route-color); box-shadow: 0 0 0 5px var(--route-soft); }
    .redirect-arrow { position: relative; height: 3px; margin: 18px 10px; background: var(--brand); }
    .redirect-arrow::after { content: ''; position: absolute; right: -1px; top: -6px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 12px solid var(--brand); }
    .destination p { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
    .flow.destination-view { grid-template-columns: minmax(0, 600px); grid-template-rows: auto; justify-content: center; }
    .signal {
      background: var(--brand-soft);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
    }
    .signal span, .signal code { display: block; }
    .signal strong { display: block; color: var(--brand); margin: 5px 0; white-space: nowrap; font-size: 14px; }
    .signal code { font-size: 12px; margin-top: 3px; }
    .signal small { display: block; font-size: 11px; margin-top: 6px; }
    .flow-navigation { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 18px; padding: 12px 0; border-top: 1px solid var(--line); position: sticky; bottom: 0; z-index: 2; background: var(--white); }
    .flow-navigation .button { min-height: 44px; }
    .flow-navigation .button:disabled { opacity: .45; cursor: default; }
    .button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    details { margin-top: 10px; color: var(--muted); }
    details code { display: inline-block; margin: 5px 8px 0 0; color: var(--ink); }
    details a { display: block; margin-top: 8px; color: var(--brand); }
    .hidden { display: none !important; }
    .empty { padding: 14px; text-align: left; color: var(--muted); background: var(--surface); border-radius: 12px; }
    .result-examples { min-width: 0; }
    .result-examples h2 { margin: 0 0 8px; font-size: 16px; }
    .result-examples p { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 6px; text-align: left; vertical-align: top; }
    th { background: var(--surface); }
    td code { display: block; font-size: 11px; margin-top: 3px; }
    @media (max-width: 900px) {
      .shell { padding: 20px 14px 38px; }
      .tool-grid, .flow, .flow.registration-view { grid-template-columns: minmax(0, 1fr); }
      .flow > .feature:first-child, .flow > .signal, .flow > .empty, .flow > .result-examples { grid-column: auto; grid-row: auto; }
      .signal { border-radius: 28px; }
      .redirect-arrow { width: 3px; height: 36px; margin: 14px auto; }
      .redirect-arrow::after { right: -5.5px; top: auto; bottom: -1px; border-top: 12px solid var(--brand); border-bottom: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; }
      .result-route .redirect-arrow::after { border-top-color: var(--route-color); border-left-color: transparent; }
    }
  </style>
</head>

  <main class="shell">
    <header class="top">
      <strong>Mapa de medición</strong>
      <span class="crumb" id="crumb">Herramientas</span>
    </header>

    <section id="home" class="tool-grid">
      <button class="tool" data-tool="mac">
        <strong>Calculadora de masa muscular</strong>
        <span>MAC</span>
      </button>
      <button class="tool" data-tool="growth">
        <strong>Growth Tool</strong>
        <span>13 países</span>
      </button>
    </section>

    <section id="mac" class="panel hidden">
      <div class="toolbar"><button class="button" data-back="home">← Herramientas</button></div>
      <h1>Calculadora de masa muscular</h1>
      <p>Flujo pendiente de documentar. Propiedad GA4: 505260213.</p>
    </section>

    <section id="growth" class="panel hidden">
      <div class="toolbar">
        <button class="button" data-back="home">← Herramientas</button>
        <button class="button" data-group="direct">CO · PE · MX</button>
        <button class="button" data-group="redirect">CL · EC · AR</button>
        <button class="button" data-group="cadr">CADR</button>
      </div>
      <div id="groupEmpty" class="empty">Selecciona un grupo de países.</div>
      <div id="countryArea" class="hidden">
        <div class="toolbar" id="countryButtons"></div>
        <div id="countryEmpty" class="empty">Selecciona un país.</div>
        <div id="countryFlow" class="hidden">
          <h1 id="journeyTitle">Growth Tool · Colombia</h1>
          <p id="stepLabel">Completa el formulario y selecciona Siguiente.</p>
          <div class="toolbar hidden" id="outcomes">
            <button class="button red" data-outcome="rojo" aria-pressed="false">Rojo</button>
            <button class="button yellow" data-outcome="amarillo" aria-pressed="false">Amarillo</button>
            <button class="button green" data-outcome="verde" aria-pressed="false">Verde</button>
          </div>
          <div class="flow" id="flowContent"></div>
          <nav class="flow-navigation" id="flowNavigation" aria-label="Navegación del mapa"></nav>
        </div>
      </div>
    </section>
  </main>

  <script>
    const countryNames = {CO:'Colombia',CL:'Chile',PE:'Perú',MX:'México',EC:'Ecuador',AR:'Argentina'};
    const groups = {
      direct: ['CO', 'PE', 'MX'],
      redirect: ['CL', 'EC', 'AR'],
      cadr: ['GT', 'HN', 'SV', 'PA', 'DO', 'CR', 'NI']
    };
    let outcome = 'rojo';
    let step = 0;
    let selectedCountry = 'CO';

    const screens = ['home', 'mac', 'growth'];
    function showScreen(id) {
      screens.forEach(screen => document.getElementById(screen).classList.toggle('hidden', screen !== id));
      document.getElementById('crumb').textContent = id === 'home' ? 'Herramientas' : id === 'mac' ? 'Herramientas / MAC' : 'Herramientas / Growth Tool';
    }

    document.querySelectorAll('[data-tool]').forEach(button => button.addEventListener('click', () => showScreen(button.dataset.tool)));
    document.querySelectorAll('[data-back]').forEach(button => button.addEventListener('click', () => showScreen(button.dataset.back)));

    document.querySelectorAll('[data-group]').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('[data-group]').forEach(item => item.classList.toggle('active', item === button));
      document.getElementById('groupEmpty').classList.add('hidden');
      document.getElementById('countryArea').classList.remove('hidden');
      document.getElementById('countryFlow').classList.add('hidden');
      document.getElementById('countryEmpty').classList.remove('hidden');
      document.getElementById('countryButtons').innerHTML = groups[button.dataset.group].map(country => '<button class="button" data-country="' + country + '">' + country + '</button>').join('');
      document.querySelectorAll('[data-country]').forEach(countryButton => countryButton.addEventListener('click', () => selectCountry(countryButton)));
    }));

    function selectCountry(button) {
      document.querySelectorAll('[data-country]').forEach(item => item.classList.toggle('active', item === button));
      if (!countryNames[button.dataset.country]) {
        document.getElementById('countryFlow').classList.add('hidden');
        document.getElementById('countryEmpty').classList.remove('hidden');
        document.getElementById('countryEmpty').textContent = button.dataset.country + ': se construirá después de aprobar Colombia.';
        return;
      }
      document.getElementById('countryEmpty').classList.add('hidden');
      document.getElementById('countryFlow').classList.remove('hidden');
      selectedCountry = button.dataset.country;
      document.getElementById('journeyTitle').textContent = 'Growth Tool · ' + countryNames[selectedCountry];
      step = 0;
      outcome = 'rojo';
      renderFlow();
    }

    document.querySelectorAll('[data-outcome]').forEach(button => button.addEventListener('click', () => {
      outcome = button.dataset.outcome;
      if (step > 1) step = 1;
      renderFlow();
    }));

    function feature(title, image, cropClass, params, nextLabel, evidence = '') {
      return '<div class="feature"><h2>' + title + '</h2><div class="crop ' + cropClass + '"><img src="' + image + '" alt="' + title + '"></div>' + (params.length ? '<details><summary>Ver parámetros</summary>' + params.map(param => '<code>' + param + '</code>').join('') + (evidence ? '<a href="' + evidence + '" target="_blank" rel="noopener">Ver evidencia</a>' : '') + '</details>' : '') + '</div>';
    }

    function signal(action, eventName, status = '') {
      return '<div class="signal"><span>' + action + '</span><strong>' + eventName + '</strong>' + (status ? '<small>' + status + '</small>' : '') + '</div>';
    }

    function submissionExample() {
      const example = tagMapData[selectedCountry][outcome].pages.find(page => page.id === 'calculate')?.event.params;
      const pending = 'Pendiente de captura';
      const params = example ? Object.entries(example).map(([name,value])=>[name,value === '' ? '(vacío)' : value]) : [['Captura',pending]];
      return '<section class="result-examples"><h2>Parámetros de gc_submission</h2><p>' + (example ? 'Ejemplo capturado' : 'Parámetros pendientes de confirmar') + ' · ' + selectedCountry + ' · ' + outcome + '</p><div class="table-scroll"><table><thead><tr><th>Parámetro</th><th>Valor de ejemplo</th></tr></thead><tbody>' + params.map(([name, value]) => '<tr><td>' + name + '</td><td>' + value + '</td></tr>').join('') + '</tbody></table></div><p>Capturas de referencia; las imágenes pueden mostrar otra medición.</p></section>';
    }

    function renderFlow() {
      const content = document.getElementById('flowContent');
      const outcomes = document.getElementById('outcomes');
      const isChile = selectedCountry === 'CL';
      const yamlPages = tagMapData[selectedCountry][outcome].pages;
      const calculatePage = yamlPages.find(page => page.id === 'calculate');
      const actionPage = yamlPages.find(page => page.id === 'result_action');
      const isShare = actionPage?.event.name === 'gc_share_tool';
      const destinationTitle = 'Página de PediaSure';
      const registrationPage = yamlPages.find(page => page.id === 'registration');
      const countryAssets = {form:calculatePage?.image, [outcome]:calculatePage?.destination.image, cta:actionPage?.image, registration:registrationPage?.image || actionPage?.destination.image, confirmation:registrationPage?.destination.image};
      const referenceOnly = registrationPage?.reference_only;
      const finalStep = isShare ? 2 : registrationPage ? 4 : 1;
      const eventParams = page => Object.entries(page?.event.params || {}).map(([name,value])=>name + ': ' + (value === '' ? '(vacío)' : value));
      const failedDestination = registrationPage?.destination.status === 'response_failed_needs_review';
      const destinationNote = referenceOnly ? 'Ejemplo de rojo · llegada de amarillo pendiente de verificar.' : failedDestination ? 'Respuesta fallida en la captura · éxito pendiente de confirmar.' : 'Usuario creado · cupón en camino.';
      const destinationImage = '<div class="feature destination"><h2>' + destinationTitle + (referenceOnly || failedDestination ? ' · referencia' : '') + '</h2><div class="crop confirmation"><img src="' + countryAssets.confirmation + '" alt="' + destinationTitle + ' de referencia"></div><p>' + destinationNote + '</p><p>' + (registrationPage?.destination.url || '') + '</p></div>';
      content.classList.toggle('destination-view', step === 4);
      content.classList.toggle('registration-view', step === 0 || step === 3 || ([1, 2].includes(step) && !isShare));
      content.classList.toggle('result-route', [1, 2].includes(step));
      content.classList.toggle('yellow', outcome === 'amarillo');
      content.classList.toggle('green', outcome === 'verde');
      outcomes.classList.toggle('hidden', false);
      const arrow = '<div class="redirect-arrow" role="img" aria-label="Acción hacia el resultado o destino"></div>';
      const arrival = (title, image, note) => '<div class="feature destination"><h2>' + title + '</h2><div class="crop"><img src="' + image + '" alt="' + title + '"></div><p>' + note + '</p></div>';
      document.querySelectorAll('[data-outcome]').forEach(button => {
        button.classList.remove('hidden');
        button.disabled = !tagMapData[selectedCountry][button.dataset.outcome].pages.length;
        button.title = button.disabled ? 'Evidencia pendiente' : '';
        const active = button.dataset.outcome === outcome;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      if (!calculatePage) {
        document.getElementById('stepLabel').textContent = 'Evidencia pendiente para este resultado.';
        content.innerHTML = '<div class="empty">Flujo pendiente de capturar.</div>';
        document.getElementById('flowNavigation').innerHTML = '';
        return;
      }

      if (step === 0) {
        document.getElementById('stepLabel').textContent = 'Completa el formulario y pulsa Calcular. El resultado aparece en la misma página.';
        content.innerHTML = feature('Formulario', countryAssets.form, 'form', [], 'Siguiente') + '<div class="transition">' + signal('Clic en Calcular', 'gc_submission', 'Sin redirección') + arrow + '</div>' + arrival('Resultado ' + outcome, countryAssets[outcome], 'Misma URL · resultado de la calculadora.') + submissionExample();
      } else if (step === 1 && isShare) {
        document.getElementById('stepLabel').textContent = 'Resultado verde: pulsa Copiar. No lleva al formulario.';
        content.innerHTML = feature('Resultado verde · Copiar', countryAssets[outcome], 'share', eventParams(actionPage), 'Siguiente') + signal('Clic en Copiar', actionPage.event.name, 'Sin redirección · sin registro');
      } else if (step === 2 && isShare) {
        document.getElementById('stepLabel').textContent = 'Selecciona Copiar para compartir la herramienta.';
        content.innerHTML = feature('Copiar enlace', countryAssets[outcome], 'share', eventParams(actionPage), 'Volver al formulario') + signal('Clic en Copiar', actionPage.event.name, 'Capturado · GA4') + '<div class="empty">Sin redirección · sin registro</div>';
      } else if (step === 1 || step === 2) {
        document.getElementById('stepLabel').textContent = 'Pulsa el botón de cupón: activa gc_register_button y lleva al formulario.';
        const ctaImage = countryAssets.cta;
        const ctaParams = Object.entries(actionPage?.event.params || {}).map(([name,value])=>name + ': ' + (value === '' ? '(vacío)' : value));
        const extras = (actionPage.additional_events || []).length ? '<details><summary>Eventos adicionales · revisar</summary>' + actionPage.additional_events.map(e=>signal('Mismo clic · ' + e.count + ' activaciones',e.name) + Object.entries(e.params).map(([name,value])=>'<code>' + name + ': ' + (value === '' ? '(vacío)' : value) + '</code>').join('')).join('') + '</details>' : '';
        content.innerHTML = feature('Resultado ' + outcome + ' · ' + actionPage.action, ctaImage, 'cta', ctaParams, 'Siguiente', actionPage.evidence || '') + '<div class="transition">' + signal('Clic en el botón de cupón', actionPage.event.name, 'Redirige al formulario de registro') + arrow + extras + '</div>' + arrival('Formulario de registro', actionPage.destination.image, (actionPage.destination.url || 'URL pendiente de confirmar.') + (!registrationPage ? ' · Envío y destino final pendientes.' : ''));
      } else if (step === 3) {
        document.getElementById('stepLabel').textContent = 'Completa y envía el registro. Al crear el usuario, se redirige a ' + (isChile ? 'PediaSure.' : 'la página de destino.');
        content.innerHTML = feature('Formulario de registro', countryAssets.registration, 'registration', eventParams(registrationPage), 'Siguiente') + '<div class="transition">' + signal(registrationPage.action, registrationPage.event.name, referenceOnly ? 'Ejemplo de rojo · pendiente en amarillo' : failedDestination ? 'Redirección con respuesta fallida · revisar' : 'Usuario creado · redirección') + arrow + '</div>' + destinationImage;
      } else {
        document.getElementById('stepLabel').textContent = referenceOnly ? 'Ejemplo de rojo. El destino de amarillo sigue pendiente de verificar.' : failedDestination ? 'La URL capturada indica responseFailed=true. Revisa el destino; no confirma éxito.' : 'Usuario creado. Revisa el mensaje del cupón.';
        content.innerHTML = feature(destinationTitle + (isChile && outcome === 'amarillo' ? ' · ejemplo' : ''), countryAssets.confirmation, 'confirmation', [], 'Volver al formulario');
      }

      const lastStep = step >= finalStep;
      document.getElementById('flowNavigation').innerHTML = '<button class="button" id="previousStep"' + (step === 0 ? ' disabled' : '') + '>← Anterior</button><button class="button primary" id="nextStep">' + (lastStep ? 'Volver al formulario ↺' : 'Siguiente →') + '</button>';
      document.getElementById('nextStep').addEventListener('click', () => {
        if (step >= finalStep) step = 0;
        else if (step === 1 && !isShare) step = 3;
        else step += 1;
        renderFlow();
      });
      document.getElementById('previousStep')?.addEventListener('click', () => {
        step = step === 3 ? 1 : Math.max(0, step - 1);
        renderFlow();
      });
    }
  </script>
</body>
</html>
